name: Docs Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout リポジトリ
      uses: actions/checkout@v4

    - name: Bun のセットアップ
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: GitHub Pages の設定
      uses: actions/configure-pages@v5

    - name: 依存関係のインストール
      working-directory: ./docs
      run: bun install --frozen-lockfile

    - name: Docusaurus ビルド
      working-directory: ./docs
      run: bun run build

    - name: ビルド成果物のアップロード
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: GitHub Pages へデプロイ
      id: deployment
      uses: actions/deploy-pages@v4
