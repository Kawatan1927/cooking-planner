name: Unit Tests CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/unit-tests-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/unit-tests-ci.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout リポジトリ
      uses: actions/checkout@v4

    - name: Bun のセットアップ
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - name: ルート依存関係のインストール
      run: bun install --frozen-lockfile

    - name: フロントエンド依存関係のインストール
      working-directory: ./frontend
      run: bun install --frozen-lockfile

    - name: バックエンド依存関係のインストール
      working-directory: ./backend
      run: bun install --frozen-lockfile

    - name: 全単体テストの実行
      run: bun run test
