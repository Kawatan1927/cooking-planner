name: CDK CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'infra/**'
      - '.github/workflows/cdk-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'infra/**'
      - '.github/workflows/cdk-ci.yml'

jobs:
  build-and-synth:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout リポジトリ
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Bun のセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 依存関係のインストール
        working-directory: ./infra
        run: bun install --frozen-lockfile

      - name: TypeScript 型チェック
        working-directory: ./infra
        run: bunx tsc --noEmit

      - name: Prettier のチェック
        working-directory: ./infra
        run: bun run format:check

      - name: ESLint の実行
        working-directory: ./infra
        run: bun run lint

      - name: ビルドの実行
        working-directory: ./infra
        run: bun run build

      - name: cdk synth の実行（dev）
        working-directory: ./infra
        run: bunx cdk synth --context stage=dev --no-staging

      - name: cdk synth の実行（prod）
        working-directory: ./infra
        run: bunx cdk synth --context stage=prod --context allowedOrigins=https://placeholder.example.com --context callbackUrls=https://placeholder.example.com/callback --context logoutUrls=https://placeholder.example.com --no-staging

      - name: CloudFormation テンプレートのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: infra/cdk.out
          retention-days: 7
