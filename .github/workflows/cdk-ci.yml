name: CDK CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'infra/**'
      - '!infra/lambda/**'
      - '.github/workflows/cdk-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'infra/**'
      - '!infra/lambda/**'
      - '.github/workflows/cdk-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout リポジトリ
      uses: actions/checkout@v4

    - name: Node.js ${{ matrix.node-version }} のセットアップ
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: infra/package-lock.json

    - name: CDK 依存関係のインストール
      working-directory: ./infra
      run: npm ci

    - name: Lambda 依存関係のインストール
      working-directory: ./infra/lambda
      run: npm ci

    - name: Lambda ビルド
      working-directory: ./infra/lambda
      run: npm run build

    - name: CDK TypeScript ビルド
      working-directory: ./infra
      run: npm run build

    - name: テストの実行
      working-directory: ./infra
      run: npm test

    - name: CDK スタック合成の検証
      working-directory: ./infra
      run: npx cdk synth

    - name: CDK diff の実行 (main ブランチのみ)
      if: github.ref == 'refs/heads/main'
      working-directory: ./infra
      run: npx cdk diff || true
      env:
        AWS_REGION: ap-northeast-1

    - name: 合成済み CloudFormation テンプレートのアップロード
      uses: actions/upload-artifact@v4
      with:
        name: cdk-synthesized-template
        path: infra/cdk.out
        retention-days: 7

