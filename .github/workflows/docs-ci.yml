name: Docs CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout リポジトリ
        uses: actions/checkout@v4

      - name: Bun のセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 依存関係のインストール
        working-directory: ./docs
        run: bun install --frozen-lockfile

      - name: フォーマットチェック
        working-directory: ./docs
        run: bun run format:check

      - name: Docusaurus ビルド
        working-directory: ./docs
        run: bun run build
