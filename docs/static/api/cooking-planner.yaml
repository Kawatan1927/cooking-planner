openapi: 3.0.3

info:
  title: Cooking Planner API
  description: |-
    個人用料理レシピ／献立／買い物リスト管理アプリの REST API 仕様。

    詳細な設計意図は [docs/04-api-design.md](https://github.com/Kawatan1927/cooking-planner/blob/main/docs/04-api-design.md) を参照してください。

    ## 認証

    `/health` を除くすべての業務エンドポイントは **Bearer Token（JWT）** による認証が必要です。
    Amazon Cognito User Pool で発行した ID トークンまたはアクセストークンを使用します。

    ```
    Authorization: Bearer <JWT>
    ```

    ## エラーレスポンス

    エラー時は以下の形式で返されます。

    ```json
    {
      "error": {
        "code": "RESOURCE_NOT_FOUND",
        "message": "Recipe not found",
        "details": null
      }
    }
    ```

    代表的なステータスコード:
    - `400 Bad Request` — バリデーションエラー等
    - `401 Unauthorized` — JWT 不正・欠如
    - `403 Forbidden` — 他ユーザーのリソースへのアクセス
    - `404 Not Found` — リソースが存在しない
    - `500 Internal Server Error` — 予期せぬ例外
  version: 1.0.0

servers:
  - url: https://{cloudfront_domain}/api
    description: Production
    variables:
      cloudfront_domain:
        default: example.cloudfront.net
        description: CloudFront ディストリビューションドメイン

security:
  - BearerAuth: []

tags:
  - name: recipes
    description: レシピ管理
  - name: menus
    description: 献立管理
  - name: shopping-list
    description: 買い物リスト
  - name: health
    description: ヘルスチェック

paths:
  /health:
    get:
      tags:
        - health
      summary: ヘルスチェック
      description: デバッグ・疎通確認用の簡易エンドポイント。
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                time: '2025-11-21T12:34:56.789Z'

  /recipes:
    get:
      tags:
        - recipes
      summary: レシピ一覧取得
      description: ログインユーザーの全レシピ一覧を取得する。初期段階ではページングなしで全件返す。
      operationId: listRecipes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
              example:
                - recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
                  name: 鶏の照り焼き
                  sourceBook: 週末の定番おかず
                  sourcePage: 34
                  baseServings: 2
                  createdAt: '2025-11-21T12:00:00.000Z'
                  updatedAt: '2025-11-21T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - recipes
      summary: レシピ作成
      description: 新しいレシピを材料と共に登録する。
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
            example:
              name: 鶏の照り焼き
              sourceBook: 週末の定番おかず
              sourcePage: 34
              baseServings: 2
              memo: 少し甘めなので砂糖控えめが好み
              ingredients:
                - ingredientName: 鶏もも肉
                  quantity: 300
                  unit: g
                  note: null
                - ingredientName: しょうゆ
                  quantity: 2
                  unit: 大さじ
                  note: null
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeIdResponse'
              example:
                recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recipes/{recipeId}:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: レシピID
        example: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
    get:
      tags:
        - recipes
      summary: レシピ詳細取得
      description: 特定のレシピの詳細情報（材料一覧含む）を取得する。
      operationId: getRecipe
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
              example:
                recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
                name: 鶏の照り焼き
                sourceBook: 週末の定番おかず
                sourcePage: 34
                baseServings: 2
                memo: 少し甘めなので砂糖控えめが好み
                createdAt: '2025-11-21T12:00:00.000Z'
                updatedAt: '2025-11-21T12:00:00.000Z'
                ingredients:
                  - ingredientName: 鶏もも肉
                    quantity: 300
                    unit: g
                    note: null
                  - ingredientName: しょうゆ
                    quantity: 2
                    unit: 大さじ
                    note: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - recipes
      summary: レシピ更新（未実装）
      description: |-
        既存レシピの情報を材料リストごと全体更新（差分ではなく置き換え）する。

        **注意:** 現在このエンドポイントはバックエンド未実装のため、呼び出すと `404 Not Found` が返ります。将来の実装予定を示すための仕様です。
      operationId: updateRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
            example:
              name: 鶏の照り焼き（甘さ控えめ）
              sourceBook: 週末の定番おかず
              sourcePage: 34
              baseServings: 2
              memo: 砂糖を小さじ1/2減らした
              ingredients:
                - ingredientName: 鶏もも肉
                  quantity: 320
                  unit: g
                  note: null
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeIdResponse'
              example:
                recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /menus:
    get:
      tags:
        - menus
      summary: 献立一覧取得（未実装）
      description: |-
        指定期間内の献立を取得する。
        `from` / `to` 未指定時は今日から7日分を返す。

        **注意:** 現在このエンドポイントはバックエンド未実装のため、呼び出すと `404 Not Found` が返ります。将来の実装予定を示すための仕様です。
      operationId: listMenus
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 開始日（YYYY-MM-DD）
          example: '2025-11-21'
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 終了日（YYYY-MM-DD）
          example: '2025-11-23'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
              example:
                from: '2025-11-21'
                to: '2025-11-23'
                items:
                  - date: '2025-11-21'
                    mealType: DINNER
                    menuId: 5b5af0bb-3c10-45e7-8f5e-6f541b2da111
                    recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
                    servings: 1
                  - date: '2025-11-22'
                    mealType: DINNER
                    menuId: d8aa570f-b827-4f08-8a40-e9ac7644a911
                    recipeId: 9f365a0e-57bc-4fa5-9664-a66a8d6736d9
                    servings: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - menus
      summary: 献立登録（未実装）
      description: |-
        ある日付・食事区分にレシピを紐付けた献立を登録する。同じ日付・食事区分に複数レシピを登録可能。

        **注意:** 現在このエンドポイントはバックエンド未実装のため、呼び出すと `404 Not Found` が返ります。将来の実装予定を示すための仕様です。
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'
            example:
              date: '2025-11-21'
              mealType: DINNER
              recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
              servings: 1
              memo: null
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuIdResponse'
              example:
                menuId: 5b5af0bb-3c10-45e7-8f5e-6f541b2da111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /menus/{menuId}:
    parameters:
      - name: menuId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 献立ID
        example: 5b5af0bb-3c10-45e7-8f5e-6f541b2da111
    put:
      tags:
        - menus
      summary: 献立更新（未実装）
      description: |-
        既存の献立（1件）を更新する。主に `servings` や `recipeId` の変更。

        **注意:** 現在このエンドポイントはバックエンド未実装のため、呼び出すと `404 Not Found` が返ります。将来の実装予定を示すための仕様です。
      operationId: updateMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'
            example:
              date: '2025-11-21'
              mealType: DINNER
              recipeId: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
              servings: 2
              memo: 友達が一人来る
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuIdResponse'
              example:
                menuId: 5b5af0bb-3c10-45e7-8f5e-6f541b2da111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - menus
      summary: 献立削除（未実装）
      description: |-
        献立から1件のレシピを削除する。

        **注意:** 現在このエンドポイントはバックエンド未実装のため、呼び出すと `404 Not Found` が返ります。将来の実装予定を示すための仕様です。
      operationId: deleteMenu
      responses:
        '204':
          description: 削除成功（レスポンスボディなし）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /shopping-list:
    get:
      tags:
        - shopping-list
      summary: 買い物リスト取得
      description: |-
        指定期間の献立から必要な材料の合計量を計算して返す。

        処理概要:
        1. `Menus` から `from`〜`to` の献立を取得
        2. 各 `menuItem` の `servings / baseServings` で分量をスケーリング
        3. `ingredientName + unit` 単位で合計値を集計

        `RecipeIngredients.quantity` が文字列の場合、人数比でスケーリングできないためスケーリングせず、同一キー内では重複を除いたうえで ` + ` で連結して返します（例: `少々` が複数献立に登場しても `少々` を 1 回だけ返す）。
      operationId: getShoppingList
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: 開始日（YYYY-MM-DD）
          example: '2025-11-21'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: 終了日（YYYY-MM-DD）
          example: '2025-11-23'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListResponse'
              example:
                from: '2025-11-21'
                to: '2025-11-23'
                items:
                  - ingredientName: 玉ねぎ
                    totalQuantity: 1.5
                    unit: 個
                  - ingredientName: 鶏もも肉
                    totalQuantity: 400
                    unit: g
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Amazon Cognito User Pool から取得した JWT（ID トークンまたはアクセストークン）。
        `Authorization: Bearer <token>` の形式で送信する。

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - time
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: '2025-11-21T12:34:56.789Z'

    RecipeSummary:
      type: object
      required:
        - recipeId
        - name
        - baseServings
        - createdAt
        - updatedAt
      properties:
        recipeId:
          type: string
          format: uuid
          example: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
        name:
          type: string
          example: 鶏の照り焼き
        sourceBook:
          type: string
          nullable: true
          example: 週末の定番おかず
        sourcePage:
          type: integer
          nullable: true
          example: 34
        baseServings:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: '2025-11-21T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-11-21T12:00:00.000Z'

    RecipeIngredient:
      type: object
      required:
        - ingredientName
        - quantity
        - unit
      properties:
        ingredientName:
          type: string
          example: 鶏もも肉
        quantity:
          oneOf:
            - type: number
            - type: string
          description: 数値（例：300）またはテキスト（例：「少々」）
          example: 300
        unit:
          type: string
          example: g
        note:
          type: string
          nullable: true

    RecipeInput:
      type: object
      required:
        - name
        - baseServings
        - ingredients
      properties:
        name:
          type: string
          example: 鶏の照り焼き
        sourceBook:
          type: string
          nullable: true
          example: 週末の定番おかず
        sourcePage:
          type: integer
          nullable: true
          example: 34
        baseServings:
          type: integer
          example: 2
        memo:
          type: string
          nullable: true
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'

    RecipeDetail:
      allOf:
        - $ref: '#/components/schemas/RecipeSummary'
        - type: object
          properties:
            memo:
              type: string
              nullable: true
            ingredients:
              type: array
              items:
                $ref: '#/components/schemas/RecipeIngredient'

    RecipeIdResponse:
      type: object
      required:
        - recipeId
      properties:
        recipeId:
          type: string
          format: uuid
          example: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11

    MealType:
      type: string
      enum:
        - BREAKFAST
        - LUNCH
        - DINNER
        - OTHER
      description: 食事区分

    MenuItem:
      type: object
      required:
        - date
        - mealType
        - menuId
        - recipeId
        - servings
      properties:
        date:
          type: string
          format: date
          example: '2025-11-21'
        mealType:
          $ref: '#/components/schemas/MealType'
        menuId:
          type: string
          format: uuid
          example: 5b5af0bb-3c10-45e7-8f5e-6f541b2da111
        recipeId:
          type: string
          format: uuid
          example: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
        servings:
          type: number
          example: 1

    MenuListResponse:
      type: object
      required:
        - from
        - to
        - items
      properties:
        from:
          type: string
          format: date
          example: '2025-11-21'
        to:
          type: string
          format: date
          example: '2025-11-23'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    MenuInput:
      type: object
      required:
        - date
        - mealType
        - recipeId
        - servings
      properties:
        date:
          type: string
          format: date
          example: '2025-11-21'
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          example: c5b4a271-4dc4-4f30-9b61-1e5b10cbfd11
        servings:
          type: number
          example: 1
        memo:
          type: string
          nullable: true

    MenuIdResponse:
      type: object
      required:
        - menuId
      properties:
        menuId:
          type: string
          format: uuid
          example: 5b5af0bb-3c10-45e7-8f5e-6f541b2da111

    ShoppingListItem:
      type: object
      required:
        - ingredientName
        - totalQuantity
        - unit
      properties:
        ingredientName:
          type: string
          example: 玉ねぎ
        totalQuantity:
          oneOf:
            - type: number
            - type: string
          example: 1.5
        unit:
          type: string
          example: 個

    ShoppingListResponse:
      type: object
      required:
        - from
        - to
        - items
      properties:
        from:
          type: string
          format: date
          example: '2025-11-21'
        to:
          type: string
          format: date
          example: '2025-11-23'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListItem'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Recipe not found
        details:
          nullable: true

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

  responses:
    BadRequest:
      description: リクエストが不正（バリデーションエラー等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request body
              details: null

    Unauthorized:
      description: 認証エラー（JWT 不正・欠如）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authorization token is missing or invalid
              details: null

    Forbidden:
      description: アクセス権限なし（他ユーザーのリソースへのアクセス）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to access this resource
              details: null

    NotFound:
      description: リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Resource not found
              details: null
