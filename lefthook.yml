glob_matcher: doublestar

# Lefthook configuration for cooking-planner
# See: https://github.com/evilmartians/lefthook

# pre-commit: 軽量チェック（staged の frontend ファイルのみ）
pre-commit:
  parallel: true
  commands:
    # フロントエンドのフォーマットチェック
    frontend-format:
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,css,md,html}"
      run: ./frontend/node_modules/.bin/prettier --check {staged_files}
      stage_fixed: false

    # フロントエンドのlint
    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: ./frontend/node_modules/.bin/eslint --config frontend/eslint.config.js {staged_files}
      stage_fixed: false

    # バックエンド（Hono）のフォーマットチェック
    backend-format:
      glob: "backend/**/*.{ts,js,json,md}"
      run: ./backend/node_modules/.bin/prettier --check {staged_files}
      stage_fixed: false

    # バックエンド（Hono）のlint
    backend-lint:
      glob: "backend/**/*.ts"
      run: ./backend/node_modules/.bin/eslint --config backend/eslint.config.mjs {staged_files}
      stage_fixed: false

# pre-push: やや重めのチェック（変更がある領域だけ）
pre-push:
  parallel: false
  commands:
    # フロントエンドのビルド
    frontend-build:
      glob: "frontend/**"
      run: |
        echo "🏗️ フロントエンドのビルドを実行中..."
        bun run frontend:build

    # バックエンド（Hono）の型チェック
    backend-typecheck:
      glob: "backend/**"
      run: |
        echo "🏗️ バックエンドの型チェックを実行中..."
        bun run backend:type-check

    # テスト実行（将来的にテストが追加された場合）
    tests:
      glob:
        - "frontend/**"
        - "backend/**"
      run: |
        echo "🧪 テストを実行中..."
        bun run test

# 設定
skip_output:
  - meta
  - summary

# リモートファイルからのフックはスキップ
remote:
  enabled: false
