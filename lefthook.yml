glob_matcher: doublestar

# Lefthook configuration for cooking-planner
# See: https://github.com/evilmartians/lefthook

# pre-commit: 軽量チェック（staged の frontend ファイルのみ）
pre-commit:
  parallel: true
  commands:
    # フロントエンドのフォーマットチェック
    frontend-format:
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,css,md,html}"
      run: ./frontend/node_modules/.bin/prettier --check {staged_files}
      stage_fixed: false

    # フロントエンドのlint
    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: ./frontend/node_modules/.bin/eslint --config frontend/eslint.config.js {staged_files}
      stage_fixed: false

    # Lambdaのフォーマットチェック
    lambda-format:
      glob: "infra/lambda/**/*.{ts,js,json,md}"
      run: ./infra/lambda/node_modules/.bin/prettier --check {staged_files}
      stage_fixed: false

    # Lambdaのlint
    lambda-lint:
      glob: "infra/lambda/**/*.ts"
      run: ./infra/lambda/node_modules/.bin/eslint --config infra/lambda/eslint.config.mjs {staged_files}
      stage_fixed: false

    # CDKのフォーマットチェック
    cdk-format:
      glob: "infra/{bin,lib}/**/*.{ts,mjs}"
      run: ./infra/node_modules/.bin/prettier --check {staged_files}
      stage_fixed: false

    # CDKのlint
    cdk-lint:
      glob: "infra/{bin,lib}/**/*.ts"
      run: bun run cdk:lint
      stage_fixed: false

# pre-push: やや重めのチェック（変更がある領域だけ）
pre-push:
  parallel: false
  commands:
    # フロントエンドのビルド
    frontend-build:
      glob: "frontend/**"
      run: |
        echo "🏗️ フロントエンドのビルドを実行中..."
        bun run frontend:build

    # Lambdaのビルド
    lambda-build:
      glob: "infra/lambda/**"
      run: |
        echo "🏗️ Lambdaのビルドを実行中..."
        bun run lambda:build

    # CDKのビルド
    cdk-build:
      glob: "infra/**"
      exclude: "infra/lambda/**"
      run: |
        echo "🏗️ CDKのビルドを実行中..."
        bun run cdk:build

    # テスト実行（将来的にテストが追加された場合）
    tests:
      glob:
        - "frontend/**"
        - "infra/lambda/**"
      run: |
        echo "🧪 テストを実行中..."
        bun run test

# 設定
skip_output:
  - meta
  - summary

# リモートファイルからのフックはスキップ
remote:
  enabled: false
